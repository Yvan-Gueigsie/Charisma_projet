
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suivi de personne</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

#container {
   position: relative;
    width: 100%;
    max-width: auto;
    margin: auto;
    aspect-ratio: 16/9;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
}

#info {
    font-size: 20px;
    padding: 15px;
}

button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

#status {
    color: lime;
}
</style>
</head>

<body>

<h2>Suivi de personne</h2>

<button id="connectButton">Connecter ESP32</button>
<button id="startButton">Démarrer caméra</button>
<button id="stopButton" disabled>Arrêter</button>

<p id="status">En attente...</p>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div id="info">
    Position X : <span id="x">0</span>
    <br><br>
    Détection : <span id="detection">Aucune</span>
    <br><br>
    Bluetooth : <span id="ble">Déconnecté</span>
</div>


<script>

// ======================================================
// ELEMENTS HTML
// ======================================================

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const xDisplay = document.getElementById("x");
const detectionDisplay = document.getElementById("detection");
const bleDisplay = document.getElementById("ble");
const statusDisplay = document.getElementById("status");

const connectButton = document.getElementById("connectButton");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");


// ======================================================
// PARAMETRES BLE
// ======================================================

const DEVICE_NAME = "SUIVI_PERSONNE_ESP32";

const SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";


// ======================================================
// VARIABLES
// ======================================================

let bleDevice = null;
let rxCharacteristic = null;

let cameraStream = null;
let model = null;

let running = false;

let writeQueue = Promise.resolve();


// ======================================================
// CONNEXION BLE
// ======================================================

async function connectBle() {

    if (!navigator.bluetooth) {
        statusDisplay.textContent =
            "Bluetooth BLE non disponible.";
        return;
    }

    try {

        statusDisplay.textContent = "Recherche ESP32...";

        bleDevice = await navigator.bluetooth.requestDevice({

            filters: [{ name: DEVICE_NAME }],
            optionalServices: [SERVICE_UUID]

        });

        bleDevice.addEventListener(
            "gattserverdisconnected",
            handleBleDisconnect
        );

        const server = await bleDevice.gatt.connect();

        const service =
            await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic =
            await service.getCharacteristic(RX_UUID);

        bleDisplay.textContent = "Connecté";

        connectButton.textContent = "ESP32 connecté";

        statusDisplay.textContent = "ESP32 connecté.";

    }
    catch(error) {

        rxCharacteristic = null;

        bleDisplay.textContent = "Déconnecté";

        statusDisplay.textContent =
            "Erreur BLE : " + error.message;

    }
}


// ======================================================
// DECONNEXION BLE
// ======================================================

function handleBleDisconnect() {

    rxCharacteristic = null;

    bleDisplay.textContent = "Déconnecté";

    connectButton.textContent = "Connecter ESP32";

    statusDisplay.textContent = "ESP32 déconnecté.";

}


// ======================================================
// ENVOI POSITION BLE
// ===============con=======================================

function sendPosition(x) {

    if (
        !bleDevice ||
        !bleDevice.gatt ||
        !bleDevice.gatt.connected ||
        !rxCharacteristic
    ) {
        return;
    }

    const data = new TextEncoder().encode(
        x.toFixed(3)
    );

    writeQueue = writeQueue.then(async () => {

        if (!rxCharacteristic || !bleDevice.gatt.connected) {
            return;
        }

        if (
            rxCharacteristic.properties.writeWithoutResponse &&
            rxCharacteristic.writeValueWithoutResponse
        ) {

            await rxCharacteristic.writeValueWithoutResponse(data);

        }
        else if (
            rxCharacteristic.properties.write &&
            rxCharacteristic.writeValueWithResponse
        ) {

            await rxCharacteristic.writeValueWithResponse(data);

        }
        else {

            await rxCharacteristic.writeValue(data);

        }

    }).catch(error => {

        console.log("Erreur BLE :", error);

    });

}


// ======================================================
// DEMARRAGE CAMERA
// ======================================================

async function startCamera() {

    cameraStream = await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "environment"
        },

        audio: false

    });

    video.srcObject = cameraStream;

    // Attendre que les dimensions vidéo soient disponibles
    await new Promise(resolve => {

        if (video.readyState >= 1) {
            resolve();
        } else {
            video.addEventListener(
                "loadedmetadata",
                resolve,
                { once: true }
            );
        }

    });

    await video.play();

}


// ======================================================
// DETECTION PERSONNE
// ======================================================

async function startDetection() {

    console.log("Chargement du modèle...");

    model = await cocoSsd.load();

    console.log("Modèle chargé");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // Démarrage de la boucle de détection initiale
    detectPerson(model);

}


// ======================================================
// DETECTION
// METHODE IDENTIQUE AU CODE INITIAL
// ======================================================

async function detectPerson(model) {

    if (!running) return;

    try {

        // Dimensions de l'image
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Détection
        const predictions = await model.detect(video);

        // Nettoyage
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Cherche les personnes
        const persons = predictions.filter(
            p => p.class === "person"
        );

        if (persons.length > 0) {

            // Personne ayant le meilleur score
            persons.sort(
                (a, b) => b.score - a.score
            );

            const person = persons[0];

            // Bounding box
            const [x, y, width, height] =
                person.bbox;

            // Centre de la personne
            const centerX =
                x + width / 2;

            // Centre de l'image
            const imageCenter =
                video.videoWidth / 2;

            // Normalisation
            let normalizedX =
                (centerX - imageCenter) / imageCenter;

            // Limitation
            normalizedX =
                Math.max(
                    -1,
                    Math.min(1, normalizedX)
                );

            // Affichage position
            xDisplay.textContent =
                normalizedX.toFixed(2);

            detectionDisplay.textContent =
                Math.round(person.score * 100) + " %";

            // Bounding box rouge
            ctx.strokeStyle = "red";
            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                width,
                height
            );

            // Ligne centrale jaune
            ctx.strokeStyle = "yellow";

            ctx.beginPath();

            ctx.moveTo(imageCenter, 0);

            ctx.lineTo(
                imageCenter,
                canvas.height
            );

            ctx.stroke();

            // Centre personne vert
            ctx.fillStyle = "lime";

            ctx.beginPath();

            ctx.arc(
                centerX,
                y + height / 2,
                8,
                0,
                2 * Math.PI
            );

            ctx.fill();

            // Envoi BLE
            sendPosition(normalizedX);

        } else {

            xDisplay.textContent = "0";

            detectionDisplay.textContent = "Aucune";

        }

    }
    catch(error) {

        console.error("Erreur détection :", error);

        statusDisplay.textContent =
            "Erreur COCO-SSD : " + error.message;

    }

    // Nouvelle détection : même méthode que le code initial
    if (running) {

        requestAnimationFrame(
            () => detectPerson(model)
        );

    }

}


// ======================================================
// DEMARRAGE
// ======================================================

async function start() {

    if (running) return;

    try {

        startButton.disabled = true;

        statusDisplay.textContent = "Démarrage caméra...";

        await startCamera();

        statusDisplay.textContent =
            "Chargement du modèle COCO-SSD...";

        // Activation de la boucle
        running = true;

        stopButton.disabled = false;

        await startDetection();

        statusDisplay.textContent =
            "Détection active.";

    }
    catch(error) {

        console.error(error);

        statusDisplay.textContent =
            "Erreur : " + error.message;

        stopTracking();

    }

}


// ======================================================
// ARRET
// ======================================================

function stopTracking() {

    running = false;

    if (cameraStream) {

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

        cameraStream = null;

    }

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    xDisplay.textContent = "0";

    detectionDisplay.textContent = "Arrêtée";

    startButton.disabled = false;

    stopButton.disabled = true;

    statusDisplay.textContent = "Suivi arrêté.";

}


// ======================================================
// BOUTONS
// ======================================================

connectButton.addEventListener(
    "click",
    connectBle
);

startButton.addEventListener(
    "click",
    start
);

stopButton.addEventListener(
    "click",
    stopTracking
);


// ======================================================
// SECURITE
// ======================================================

if (!window.isSecureContext) {

    statusDisplay.textContent =
        "HTTPS nécessaire pour la caméra et le BLE.";

}

</script>

</body>
</html>

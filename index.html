
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caméra téléphone</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 { margin: 20px; }

button {
    font-size: 18px;
    padding: 12px 25px;
    margin: 10px;
}

video {
    width: 90%;
    max-width: 800px;
    margin-top: 20px;
}

#status {
    margin: 15px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Caméra du téléphone</h1>

<button id="connectButton">Connecter l'ESP32</button>
<button id="startButton">Démarrer la caméra</button>

<p id="status">Bluetooth non connecté</p>

<br>
<video id="video" autoplay playsinline></video>

<script>
const video = document.getElementById("video");
const startButton = document.getElementById("startButton");
const connectButton = document.getElementById("connectButton");
const status = document.getElementById("status");

// UUID du service BLE ESP32
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

// UUID de la caractéristique RX
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let bleDevice = null;
let rxCharacteristic = null;

// Connexion Bluetooth
connectButton.addEventListener("click", async function() {
    try {
        if (!navigator.bluetooth) {
            status.textContent =
                "Bluetooth Web non disponible. Utilise Chrome sur Android.";
            return;
        }

        status.textContent = "Recherche de l'ESP32...";

        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: "SUIVI_PERSONNE_ESP32" }],
            optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(RX_UUID);

        status.textContent = "ESP32 connecté !";

        bleDevice.addEventListener("gattserverdisconnected", function() {
            rxCharacteristic = null;
            status.textContent = "ESP32 déconnecté";
        });

    } catch (error) {
        console.error(error);
        status.textContent = "Erreur Bluetooth : " + error.message;
    }
});

// Envoi de la position à l'ESP32
async function sendPosition(x) {
    if (!rxCharacteristic) return;

    try {
        const value = new TextEncoder().encode(x.toFixed(2));
        await rxCharacteristic.writeValue(value);
    } catch (error) {
        console.error("Erreur d'envoi BLE :", error);
    }
}

// Démarrage de la caméra
startButton.addEventListener("click", async function() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        });

        video.srcObject = stream;
        console.log("Caméra démarrée");

    } catch (error) {
        console.error(error);
        alert("Impossible d'accéder à la caméra : " + error.message);
    }
});

// TEST : déplacement manuel de la position
// À remplacer ensuite par la détection de personne.
let testPosition = 0;

setInterval(async function() {
    if (!rxCharacteristic) return;

    testPosition += 0.05;

    if (testPosition > 1) {
        testPosition = -1;
    }

    await sendPosition(testPosition);

}, 100);
</script>

</body>
</html>

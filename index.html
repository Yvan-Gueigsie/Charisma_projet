
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suivi de personne</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

#container {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: auto;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#info {
    font-size: 18px;
    padding: 15px;
}

button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

</style>

</head>

<body>

<h2>Suivi de personne</h2>

<button id="connectButton">Connecter ESP32</button>
<button id="startButton">Démarrer caméra</button>
<button id="stopButton" disabled>Arrêter</button>

<p id="status">En attente...</p>

<div id="container">

    <video id="video" autoplay muted playsinline></video>

    <canvas id="canvas"></canvas>

</div>

<div id="info">

    Position X : <span id="x">0.000</span>
    <br><br>

    Détection : <span id="detection">Aucune</span>
    <br><br>

    Bluetooth : <span id="ble">Déconnecté</span>

</div>


<script>

// ======================================================
// PARAMÈTRES BLUETOOTH BLE
// ======================================================

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const DEVICE_NAME = "SUIVI_PERSONNE_ESP32";


// ======================================================
// PARAMÈTRES DE TRANSMISSION
// ======================================================

const MIN_SEND_INTERVAL_MS = 100;

const HEARTBEAT_INTERVAL_MS = 500;

const POSITION_EPSILON = 0.02;


// ======================================================
// ELEMENTS HTML
// ======================================================

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const xDisplay = document.getElementById("x");

const detectionDisplay = document.getElementById("detection");

const bleDisplay = document.getElementById("ble");

const statusDisplay = document.getElementById("status");

const connectButton = document.getElementById("connectButton");

const startButton = document.getElementById("startButton");

const stopButton = document.getElementById("stopButton");


// ======================================================
// VARIABLES
// ======================================================

let model = null;

let cameraStream = null;

let bleDevice = null;

let rxCharacteristic = null;

let running = false;

let lastSentPosition = null;

let lastSentAt = 0;


// ======================================================
// GESTION DU STATUT
// ======================================================

function setStatus(message) {

    statusDisplay.textContent = message;

}


function isBleConnected() {

    return Boolean(
        bleDevice &&
        bleDevice.gatt &&
        bleDevice.gatt.connected &&
        rxCharacteristic
    );

}


// ======================================================
// CONNEXION BLUETOOTH BLE
// ======================================================

async function connectBle() {

    if (!navigator.bluetooth) {

        setStatus("Web Bluetooth non disponible. Utilise Chrome sur Android.");

        return;

    }

    try {

        setStatus("Recherche de l'ESP32...");

        bleDevice = await navigator.bluetooth.requestDevice({

            filters: [{ name: DEVICE_NAME }],

            optionalServices: [SERVICE_UUID]

        });


        bleDevice.addEventListener(
            "gattserverdisconnected",
            handleBleDisconnect
        );


        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(RX_UUID);


        bleDisplay.textContent = "Connecté";

        connectButton.textContent = "ESP32 connecté";

        setStatus("ESP32 connecté en Bluetooth BLE.");

    }

    catch (error) {

        rxCharacteristic = null;

        bleDisplay.textContent = "Déconnecté";

        setStatus("Erreur BLE : " + error.message);

    }

}


function handleBleDisconnect() {

    rxCharacteristic = null;

    bleDisplay.textContent = "Déconnecté";

    connectButton.textContent = "Connecter ESP32";

    setStatus("ESP32 déconnecté.");

}


// ======================================================
// ENVOI DE LA POSITION À L'ESP32
// ======================================================

async function writePosition(position) {

    if (!isBleConnected()) return false;

    const value = new TextEncoder().encode(
        position.toFixed(3)
    );

    try {

        if (
            rxCharacteristic.properties.writeWithoutResponse &&
            rxCharacteristic.writeValueWithoutResponse
        ) {

            await rxCharacteristic.writeValueWithoutResponse(value);

        }

        else if (
            rxCharacteristic.properties.write &&
            rxCharacteristic.writeValueWithResponse
        ) {

            await rxCharacteristic.writeValueWithResponse(value);

        }

        else {

            await rxCharacteristic.writeValue(value);

        }

        lastSentPosition = position;

        lastSentAt = performance.now();

        return true;

    }

    catch (error) {

        setStatus("Erreur d'envoi BLE : " + error.message);

        return false;

    }

}


// ======================================================
// GESTION DE LA FREQUENCE D'ENVOI
// ======================================================

async function sendPositionIfDue(position, force = false) {

    if (!isBleConnected()) return;

    const now = performance.now();

    const changed =
        lastSentPosition === null ||
        Math.abs(position - lastSentPosition) >= POSITION_EPSILON;

    const heartbeatDue =
        now - lastSentAt >= HEARTBEAT_INTERVAL_MS;

    const minimumIntervalElapsed =
        now - lastSentAt >= MIN_SEND_INTERVAL_MS;


    if (
        force ||
        (
            minimumIntervalElapsed &&
            (changed || heartbeatDue)
        )
    ) {

        await writePosition(position);

    }

}


// ======================================================
// DEMARRAGE CAMERA
// ======================================================

async function startCamera() {

    cameraStream = await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "environment"
        },

        audio: false

    });

    video.srcObject = cameraStream;

    await new Promise(resolve => {

        if (video.readyState >= 1) {

            resolve();

        }

        else {

            video.addEventListener(
                "loadedmetadata",
                resolve,
                { once: true }
            );

        }

    });

    await video.play();

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    document.getElementById("container").style.aspectRatio =
        `${video.videoWidth} / ${video.videoHeight}`;

}


// ======================================================
// DETECTION PERSONNE
// ======================================================

async function startDetection() {

    console.log("Chargement du modèle...");

    model = await cocoSsd.load();

    console.log("Modèle chargé");

    detectPerson();

}


// ======================================================
// DETECTION
// ======================================================

async function detectPerson() {

    while (running) {

        try {

            // Détection avec COCO-SSD
            const predictions = await model.detect(video);


            // Nettoyage du canvas
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Cherche les personnes
            const persons = predictions.filter(
                p => p.class === "person"
            );


            if (persons.length > 0) {

                // On prend la personne avec
                // la plus grande probabilité

                persons.sort(
                    (a, b) => b.score - a.score
                );

                const person = persons[0];


                // -------------------------------
                // Bounding box
                // -------------------------------

                const [x, y, width, height] =
                    person.bbox;


                // Centre de la personne
                const centerX =
                    x + width / 2;


                // Centre de l'image
                const imageCenter =
                    video.videoWidth / 2;


                // -------------------------------
                // Normalisation
                // -------------------------------

                let normalizedX =
                    (centerX - imageCenter)
                    / imageCenter;


                // Limitation
                normalizedX =
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            normalizedX
                        )
                    );


                // Affichage
                xDisplay.textContent =
                    normalizedX.toFixed(3);

                detectionDisplay.textContent =
                    Math.round(person.score * 100) + " %";


                // -------------------------------
                // Dessin
                // -------------------------------

                ctx.strokeStyle = "red";

                ctx.lineWidth = 4;

                ctx.strokeRect(
                    x,
                    y,
                    width,
                    height
                );


                // Ligne centrale
                ctx.strokeStyle = "yellow";

                ctx.beginPath();

                ctx.moveTo(
                    imageCenter,
                    0
                );

                ctx.lineTo(
                    imageCenter,
                    canvas.height
                );

                ctx.stroke();


                // Point central de la personne
                ctx.fillStyle = "lime";

                ctx.beginPath();

                ctx.arc(
                    centerX,
                    y + height / 2,
                    8,
                    0,
                    2 * Math.PI
                );

                ctx.fill();


                // -------------------------------
                // ENVOI ESP32 EN BLE
                // -------------------------------

                await sendPositionIfDue(normalizedX);

            }

            else {

                // Aucune personne détectée
                xDisplay.textContent = "0.000";

                detectionDisplay.textContent = "Aucune";


                // Envoi d'une position neutre
                await sendPositionIfDue(
                    0,
                    lastSentPosition !== 0
                );

            }

        }

        catch (error) {

            running = false;

            setStatus("Erreur détection : " + error.message);

            await stopTracking(false);

            break;

        }

    }

}


// ======================================================
// DEMARRAGE DU SUIVI
// ======================================================

async function startTracking() {

    if (running) return;

    startButton.disabled = true;

    try {

        setStatus("Démarrage de la caméra...");

        await startCamera();

        setStatus("Chargement du modèle COCO-SSD...");

        await startDetection();

    }

    catch (error) {

        await stopTracking(false);

        setStatus("Erreur : " + error.message);

    }

}


// ======================================================
// ARRET DU SUIVI
// ======================================================

async function stopTracking(sendNeutral = true) {

    running = false;

    // Envoyer 0 avant l'arrêt
    if (sendNeutral && isBleConnected()) {

        await writePosition(0);

    }


    if (cameraStream) {

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

        cameraStream = null;

    }


    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    startButton.disabled = false;

    stopButton.disabled = true;

    xDisplay.textContent = "0.000";

    detectionDisplay.textContent = "Arrêtée";

    if (sendNeutral) {

        setStatus("Suivi arrêté.");

    }

}


// ======================================================
// BOUTONS
// ======================================================

connectButton.addEventListener(
    "click",
    connectBle
);


startButton.addEventListener(
    "click",
    startTracking
);


stopButton.addEventListener(
    "click",
    () => stopTracking(true)
);


// ======================================================
// INITIALISATION
// ======================================================

if (!window.isSecureContext) {

    setStatus(
        "Ouvre cette page en HTTPS pour utiliser la caméra et le BLE."
    );

}

</script>

</body>
</html>

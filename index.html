
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Suivi de personne</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

#container {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: auto;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#info {
    font-size: 20px;
    padding: 15px;
}

button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#connectButton {
    background: #0878d1;
    color: white;
}

#startButton {
    background: #168a45;
    color: white;
}

#stopButton {
    background: #bd3434;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    padding: 10px;
    color: #00ff80;
}

</style>

</head>


<body>

<h2>Suivi de personne</h2>

<!-- ================================================== -->
<!-- BOUTONS -->
<!-- ================================================== -->

<button id="connectButton">
    Connecter ESP32
</button>

<button id="startButton">
    Démarrer caméra
</button>

<button id="stopButton" disabled>
    Arrêter
</button>


<!-- ================================================== -->
<!-- ETAT DU SYSTEME -->
<!-- ================================================== -->

<p id="status">
    En attente de connexion...
</p>


<!-- ================================================== -->
<!-- CAMERA -->
<!-- ================================================== -->

<div id="container">

    <video id="video"
           autoplay
           muted
           playsinline>
    </video>

    <canvas id="canvas"></canvas>

</div>


<!-- ================================================== -->
<!-- AFFICHAGE -->
<!-- ================================================== -->

<div id="info">

    Position X :
    <span id="x">0</span>

    <br><br>

    Détection :
    <span id="detection">Aucune</span>

    <br><br>

    Bluetooth :
    <span id="ble">Déconnecté</span>

</div>


<script>

// ======================================================
// ELEMENTS HTML
// ======================================================

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const xDisplay = document.getElementById("x");

const detectionDisplay = document.getElementById("detection");

const bleDisplay = document.getElementById("ble");

const statusDisplay = document.getElementById("status");

const connectButton = document.getElementById("connectButton");

const startButton = document.getElementById("startButton");

const stopButton = document.getElementById("stopButton");


// ======================================================
// PARAMETRES BLUETOOTH BLE
// ======================================================

const DEVICE_NAME = "SUIVI_PERSONNE_ESP32";

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


// ======================================================
// VARIABLES
// ======================================================

let bleDevice = null;

let rxCharacteristic = null;

let cameraStream = null;

let model = null;

let running = false;

// File d'attente pour les transmissions BLE
let writeQueue = Promise.resolve();


// ======================================================
// CONNEXION BLUETOOTH
// ======================================================

async function connectBle()
{

    if (!navigator.bluetooth)
    {

        statusDisplay.textContent =
            "Bluetooth BLE non disponible sur ce navigateur.";

        return;

    }

    try
    {

        statusDisplay.textContent =
            "Recherche de l'ESP32...";


        bleDevice = await navigator.bluetooth.requestDevice({

            filters: [
                { name: DEVICE_NAME }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });


        // Connexion au serveur GATT

        const server = await bleDevice.gatt.connect();


        // Recherche du service

        const service =
            await server.getPrimaryService(SERVICE_UUID);


        // Recherche de la caractéristique RX

        rxCharacteristic =
            await service.getCharacteristic(RX_UUID);


        // Etat de connexion

        bleDisplay.textContent = "Connecté";

        connectButton.textContent = "ESP32 connecté";

        statusDisplay.textContent =
            "ESP32 connecté avec succès !";


        // Surveillance de la déconnexion

        bleDevice.addEventListener(
            "gattserverdisconnected",
            handleBleDisconnect
        );

    }

    catch(error)
    {

        rxCharacteristic = null;

        bleDisplay.textContent = "Déconnecté";

        statusDisplay.textContent =
            "Erreur Bluetooth : " + error.message;

    }

}


// ======================================================
// GESTION DE LA DECONNEXION
// ======================================================

function handleBleDisconnect()
{

    rxCharacteristic = null;

    bleDisplay.textContent = "Déconnecté";

    connectButton.textContent = "Connecter ESP32";

    statusDisplay.textContent =
        "ESP32 déconnecté.";

}


// ======================================================
// ENVOI DE X A L'ESP32 PAR BLE
// ======================================================

function sendPosition(x)
{

    if (
        !bleDevice ||
        !bleDevice.gatt ||
        !bleDevice.gatt.connected ||
        !rxCharacteristic
    )
    {
        return;
    }


    // Conversion en texte

    const data = new TextEncoder().encode(
        x.toFixed(3)
    );


    // Mise en file d'attente pour éviter
    // plusieurs écritures simultanées

    writeQueue = writeQueue.then(async () =>
    {

        if (
            !bleDevice ||
            !bleDevice.gatt.connected ||
            !rxCharacteristic
        )
        {
            return;
        }


        if (
            rxCharacteristic.properties.writeWithoutResponse &&
            rxCharacteristic.writeValueWithoutResponse
        )
        {

            await rxCharacteristic.writeValueWithoutResponse(data);

        }

        else if (
            rxCharacteristic.properties.write &&
            rxCharacteristic.writeValueWithResponse
        )
        {

            await rxCharacteristic.writeValueWithResponse(data);

        }

        else
        {

            await rxCharacteristic.writeValue(data);

        }

    })
    .catch(error =>
    {

        console.log("Erreur transmission BLE :", error);

    });

}


// ======================================================
// DEMARRAGE CAMERA
// ======================================================

async function startCamera()
{

    const stream = await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "environment"
        },

        audio: false

    });


    cameraStream = stream;

    video.srcObject = stream;


    // Attendre que la caméra soit prête

    await new Promise(resolve =>
    {

        if (video.readyState >= 1)
        {

            resolve();

        }

        else
        {

            video.addEventListener(
                "loadedmetadata",
                resolve,
                { once: true }
            );

        }

    });


    await video.play();


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

}


// ======================================================
// DETECTION PERSONNE
// ======================================================

async function startDetection()
{

    console.log("Chargement du modèle...");

    const modelLoaded = await cocoSsd.load();

    console.log("Modèle chargé");

    model = modelLoaded;

    detectPerson(model);

}


// ======================================================
// DETECTION
// ======================================================

async function detectPerson(model)
{

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    const predictions = await model.detect(video);


    // Nettoyage
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Cherche les personnes
    const persons = predictions.filter(
        p => p.class === "person"
    );


    if (persons.length > 0)
    {

        // On prend la personne avec
        // la plus grande probabilité

        persons.sort(
            (a, b) => b.score - a.score
        );

        const person = persons[0];


        // -------------------------------
        // Bounding box
        // -------------------------------

        const [x, y, width, height] =
            person.bbox;


        // Centre de la personne
        const centerX =
            x + width / 2;


        // Centre de l'image
        const imageCenter =
            video.videoWidth / 2;


        // -------------------------------
        // Normalisation
        // -------------------------------

        let normalizedX =
            (centerX - imageCenter)
            / imageCenter;


        // Limitation
        normalizedX =
            Math.max(
                -1,
                Math.min(
                    1,
                    normalizedX
                )
            );


        // Affichage
        xDisplay.textContent =
            normalizedX.toFixed(2);

        detectionDisplay.textContent =
            Math.round(person.score * 100) + " %";


        // -------------------------------
        // Dessin
        // -------------------------------

        ctx.strokeStyle = "red";

        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        // Ligne centrale
        ctx.strokeStyle = "yellow";

        ctx.beginPath();

        ctx.moveTo(
            imageCenter,
            0
        );

        ctx.lineTo(
            imageCenter,
            canvas.height
        );

        ctx.stroke();


        // Point central de la personne
        ctx.fillStyle = "lime";

        ctx.beginPath();

        ctx.arc(
            centerX,
            y + height / 2,
            8,
            0,
            2 * Math.PI
        );

        ctx.fill();


        // -------------------------------
        // ENVOI ESP32 PAR BLE
        // -------------------------------

        sendPosition(normalizedX);

    }


    // Nouvelle détection
    if (running)
    {

        requestAnimationFrame(
            () => detectPerson(model)
        );

    }

}


// ======================================================
// DEMARRAGE DU SYSTEME
// ======================================================

async function start()
{

    if (running) return;

    try
    {

        startButton.disabled = true;

        statusDisplay.textContent =
            "Démarrage de la caméra...";


        await startCamera();


        statusDisplay.textContent =
            "Chargement du modèle de détection...";


        running = true;

        stopButton.disabled = false;


        await startDetection();


        statusDisplay.textContent =
            "Détection active.";

    }

    catch(error)
    {

        statusDisplay.textContent =
            "Erreur : " + error.message;

        await stopTracking();

    }

}


// ======================================================
// ARRET DU SYSTEME
// ======================================================

async function stopTracking()
{

    running = false;


    // Arrêt de la caméra

    if (cameraStream)
    {

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

        cameraStream = null;

    }


    video.srcObject = null;


    // Nettoyage du canvas

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Mise à jour affichage

    xDisplay.textContent = "0";

    detectionDisplay.textContent = "Arrêtée";


    startButton.disabled = false;

    stopButton.disabled = true;


    statusDisplay.textContent =
        "Suivi arrêté.";

}


// ======================================================
// EVENEMENTS DES BOUTONS
// ======================================================

connectButton.addEventListener(
    "click",
    connectBle
);


startButton.addEventListener(
    "click",
    start
);


stopButton.addEventListener(
    "click",
    stopTracking
);


// ======================================================
// VERIFICATION HTTPS
// ======================================================

if (!window.isSecureContext)
{

    statusDisplay.textContent =
        "Attention : HTTPS nécessaire pour la caméra et le BLE.";

}

</script>

</body>

</html>
